<main><h1>#513 界面预览</h1><p class="m">commit 3a87591 · <a href="https://github.com/yetone/magpie/pull/513">回到 PR</a> · 用量页「请求」列表的筛选同步逻辑改了：切换时间范围后，如果已选的 Agent 或供应商在新范围里没有请求，magpie 现在会清空这个失效筛选、把分页复位到第一页并重新请求、在新结果返回后重绘列表，而不是像以前那样筛选器显示「全部」但列表仍停留在旧筛选的空结果上（此前只有网关密钥筛选是这么处理的）。</p>
